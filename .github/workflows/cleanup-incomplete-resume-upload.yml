name: Cleanup incomplete resume upload

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-incomplete-resume-upload.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove incomplete upload files
        run: |
          rm -rf .resume-upload .resume-final-upload
          rm -f .github/workflows/cleanup-incomplete-resume-upload.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to clean"
            exit 0
          fi
          git commit -m "Remove incomplete resume upload files"
          git push
