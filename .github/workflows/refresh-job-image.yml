name: Refresh job project image

on:
  push:
    paths:
      - .github/workflows/refresh-job-image.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bust image cache
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('assets/job-search-project.webp.b64.txt"', 'assets/job-search-project.webp.b64.txt?v=838ede2"')
          s = s.replace("fetch(image.dataset.b64Src,{cache:'force-cache'})", "fetch(image.dataset.b64Src,{cache:'no-store'})")
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Bust cache for job search project image"
          git push
