name: Add Malam-Team experience

on:
  push:
    paths:
      - .github/workflows/add-malam-team.yml

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Add Malam-Team after Nextrade
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          if 'Malam-Team (Coral)' not in html:
              pattern = re.compile(
                  r'(<article class="job"><div class="job-meta"><b>2013 – 2018</b>Nextrade</div><div><h3>Senior Java Full Stack Developer</h3>.*?</article>)',
                  re.DOTALL,
              )
              addition = (
                  '<article class="job"><div class="job-meta"><b>2007 – 2010</b>Malam-Team (Coral)</div>'
                  '<div><h3>Java / JSF Full Stack Developer</h3>'
                  '<p>Developed end-to-end web application features, including JSF pages, server-side Java logic, and database integration.</p>'
                  '</div></article>'
              )
              html, count = pattern.subn(r'\1' + addition, html, count=1)
              if count != 1:
                  raise SystemExit('Could not locate the Nextrade experience block.')
              path.write_text(html, encoding='utf-8')
          PY

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/add-malam-team.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/add-malam-team.yml
          git diff --cached --quiet || git commit -m "Add Malam-Team experience"
          git push origin main
