name: Use GitHub resume download

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/use-github-resume.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace Drive links with repository PDF
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'https://drive.google.com/uc?export=download&id=1uBpx2REcgWbwgFEbVaCCrbSOLj_M97GZ'
          new = 'assets/Sar_Shalom_Simchi_Resume.pdf'
          count = s.count(old)
          if count != 2:
              raise SystemExit(f'Expected 2 Drive links, found {count}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          rm -f .github/workflows/use-github-resume.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/use-github-resume.yml
          git commit -m 'Serve resume directly from GitHub Pages'
          git push
